<!DOCTYPE html>
<html>
  <head>
    <title>Adem Ben Halima | Student</title>
    <style>
      body, html { 
        margin: 0 !important; 
        padding: 0 !important; 
        height: 100% !important; 
        background-color: #0A0807 !important; 
        overflow: hidden !important;
      }
      .iframe-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #0A0807;
        overflow: hidden; 
      }
      /* Increased the crop size and added aggressive CSS resets */
      iframe { 
        position: absolute;
        display: block;
        top: -10px;  
        left: -10px; 
        width: calc(100% + 20px); 
        height: calc(100% + 80px); 
        border: 0 !important; 
        outline: none !important;
        box-shadow: none !important;
        background-color: #0A0807 !important;
      }
    </style>
  </head>
  <body>
    <div class="iframe-wrapper">
      <!-- Added allowtransparency and explicit frame styling -->
      <iframe src="https://adembh.streamlit.app/?embed=true&embed_options=dark_theme" allowtransparency="true" frameborder="0" marginheight="0" marginwidth="0"></iframe>
    </div>
  </body>
</html>
